name: Quality & Validation

# Runs comprehensive quality checks on all PRs:
# - Prettier (formatting)
# - ESLint (linting)
# - markdownlint (markdown quality)
# - bmod files (every skills/*/bmod.toml, the module record, its help and roster)

"on":
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prettier format check
        run: npm run format:check

  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: markdownlint
        run: npm run lint:md

  bmod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout BMAD-METHOD, which owns the runtime that reads bmod files
        uses: actions/checkout@v4
        with:
          repository: bmad-code-org/BMAD-METHOD
          ref: dev
          path: .bmad-method

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: This repository's bmod checks
        run: uv run --python 3.11 tools/stamp_release.py --check

      - name: The runtime's bmod checks
        run: uv run .bmad-method/tools/validate_manifests.py --project-root .
